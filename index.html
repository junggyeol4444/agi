<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AGI 성장</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,'Malgun Gothic',sans-serif; background:#0f1115; color:#e6e8ee; }
  .wrap { display:flex; min-height:100vh; }
  .side { width:230px; background:#161922; border-right:1px solid #262a36; padding:16px 0; flex-shrink:0; }
  .side h1 { font-size:15px; margin:0 0 4px 18px; color:#fff; }
  .side .sub { font-size:11px; color:#8a90a0; margin:0 0 16px 18px; }
  .step { padding:11px 18px; cursor:pointer; border-left:3px solid transparent; font-size:14px; color:#b8bdca; }
  .step:hover { background:#1c202b; }
  .step.on { background:#1c2230; border-left-color:#5b8cff; color:#fff; font-weight:600; }
  .step .n { color:#5b8cff; font-weight:700; margin-right:7px; }
  .step .age { display:block; font-size:11px; color:#6b7180; margin-top:2px; margin-left:22px; }
  .main { flex:1; padding:28px 34px; max-width:760px; }
  .title { font-size:20px; font-weight:700; margin:0 0 4px; }
  .desc { font-size:13px; color:#9aa0b0; margin:0 0 20px; line-height:1.6; }
  .card { background:#161922; border:1px solid #262a36; border-radius:10px; padding:18px; margin-bottom:14px; }
  .card .label { font-size:13px; color:#c4c9d6; margin-bottom:10px; font-weight:600; }
  .card .hint { font-size:12px; color:#7d8392; margin-bottom:10px; line-height:1.5; }
  button { background:#2a3142; color:#e6e8ee; border:1px solid #3a4254; cursor:pointer; font-family:inherit;
           font-size:13px; padding:9px 16px; border-radius:7px; font-weight:600; }
  button:hover { background:#323a4d; }
  button.go { background:#3a5bd0; border-color:#3a5bd0; }
  button.go:hover { background:#4368e0; }
  input { background:#0f1115; color:#e6e8ee; border:1px solid #3a4254; border-radius:7px;
          padding:9px 12px; font-family:inherit; font-size:13px; width:160px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .out { background:#0c0e13; border:1px solid #222633; border-radius:8px; padding:12px 14px;
         margin-top:12px; font-size:13px; line-height:1.7; min-height:24px; white-space:pre-wrap; color:#cdd2de; }
  .out .me { color:#7d8392; }
  .out .ai { color:#9ecbff; }
  .status { font-size:12px; color:#7d8392; margin-bottom:16px; }
  .status b { color:#9ecbff; }
  .toggle { display:inline-flex; align-items:center; gap:6px; padding:7px 12px; border-radius:7px;
            border:1px solid #3a4254; cursor:pointer; font-size:12px; margin:3px; }
  .autolog { max-height:340px; overflow-y:auto; font-size:13px; line-height:1.9; }
  .actline { padding:3px 0; border-bottom:1px solid #1a1d27; color:#cdd2de; }
  .toggle.on { background:#1e3a2a; border-color:#2e6a44; color:#7fe0a0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="side">
    <h1>AGI 성장</h1>
    <p class="sub">자라는 단계를 따라가요</p>
    <div id="steps"></div>
  </div>
  <div class="main">
    <div class="status" id="status">상태 불러오는 중…</div>
    <div id="content"></div>
  </div>
</div>
<script>
const STEPS = [
  { n:9, name:"🌱 자동 성장", age:"알아서 살고 배움 (메인)",
    desc:"켜면 스스로 살아가며, 모르는 걸 알아서 찾아 배우고, 추론하고, 의심해요. 아래에 지금 무엇을 하는지 실시간으로 보여줘요. 당신은 가끔 말만 걸면 돼요." },
  { n:1, name:"유아기", age:"갓 태어남 · 보고 듣기",
    desc:"백지에서 시작해요. 시간을 보내며(살게 하기) 보고 듣고 사물을 익혀요. 가장 먼저 할 일이에요." },
  { n:2, name:"말하기", age:"단어와 문장",
    desc:"단어를 배우고, 두·세 단어 문장을 조사와 어순으로 만들어요. 사물을 말하고 단어로 대화해요." },
  { n:3, name:"호기심", age:"스스로 배우기",
    desc:"모르는 걸 궁금해하고 스스로 인터넷에서 찾아 배워요. 궁금증이 또 다른 궁금증으로 이어져요." },
  { n:4, name:"추론", age:"생각하기",
    desc:"배운 것에서 안 배운 걸 알아내요. 분류(~이다), 인과(왜?), 모순, 가설 검증." },
  { n:5, name:"이해·대화", age:"엮어서 말하기",
    desc:"한 개념에 여러 갈래를 묶어 이해하고, 아는 걸 진짜로 주고받아 대화해요." },
  { n:6, name:"진짜 이해", age:"개념 관계망",
    desc:"단순 분류(~이다)를 넘어, 개념끼리의 관계를 알아요. 부분-전체, 가짐, 반대, 원인-결과. 아이가 찾아 배우며 스스로 관계망을 쌓아요." },
  { n:7, name:"통합·자율", age:"스스로 살피고 계획",
    desc:"배움과 말이 이어져요 — 처음 확실히 알게 되면 그 말로 말해보고, 뭘 알고 모르는지 스스로 평가하고, 제일 궁금한 것부터 계획을 세워요." },
  { n:8, name:"마음·사회", age:"기분·비유·상대 기억",
    desc:"겪을 때 기분으로 좋아/싫어가 생기고, 분류가 어긋나도 같이 쓰는 말이 겹치면 비유로 알아듣고, 당신이 말한 걸 기억하고, 어긋나면 되물어요." },
  { n:0, name:"⚙ 인터넷 설정", age:"번역·검색 켜기",
    desc:"사진·소리·번역·검색을 인터넷에서 진짜로 가져올지 켜요. (네 컴퓨터에서만 작동)" },
];
let cur = 9;
async function post(path, body){
  const r = await fetch(path, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body||{})});
  return await r.json();
}
function drawSteps(){
  const el = document.getElementById("steps"); el.innerHTML = "";
  for(const s of STEPS){
    const d = document.createElement("div");
    d.className = "step" + (s.n===cur ? " on":"");
    d.innerHTML = `<span class="n">${s.n>0?s.n:"⚙"}</span>` + s.name + `<span class="age">${s.age}</span>`;
    d.onclick = ()=>{ cur=s.n; drawSteps(); drawContent(); };
    el.appendChild(d);
  }
}
async function refreshStatus(){
  try{
    const s = await (await fetch("/stats")).json();
    document.getElementById("status").innerHTML =
      `나이 <b>${s.age_label||"?"}</b> · 단계 <b>${s.stage_name||"?"}</b> · 아는 단어 <b>${s.words_known||0}</b>개 · 들은 문장 <b>${s.sentences_heard||0}</b>`;
    // 자동 화면이면 활동 로그·버튼 갱신
    if((cur===3||cur===4)) loadMind();
    if(cur===6) loadWeb();
    if(cur===7) loadSelf();
    if(cur===8) loadSocial();
    // 실황 로그는 오른쪽 패널(노란 칸)에 항상 그린다
    if(s.auto){
      const slog=document.getElementById("side_log");
      if(slog){
        const acts=s.auto.activity||[];
        slog.innerHTML = acts.length? acts.map(a=>`<div class="actline">${a}</div>`).join("") : "<div class='hint'>자동 성장을 켜면 여기 실시간으로 떠요.</div>";
      }
    }
    if(cur===9 && s.auto){
      const b=document.getElementById("btn_auto_main");
      if(b){ _auto=!!s.auto.running; b.textContent=_auto?"⏸ 자동 멈추기":"▶ 자동 성장 시작"; b.classList.toggle("go",_auto); }
    }
  }catch(e){
    document.getElementById("status").innerHTML = "서버에 연결 못 함 — python server.py 가 켜져 있나요?";
  }
}
function drawContent(){
  const s = STEPS.find(x=>x.n===cur);
  let html = `<div class="title">${s.n>0?s.n+"단계 · ":""}${s.name}</div>`;
  html += `<div class="desc">${s.desc}</div>` + (CONTENT[cur]||"");
  document.getElementById("content").innerHTML = html;
  if(cur===0) syncToggles();   // 설정 탭이면 현재 서버 설정을 토글에 반영
  if(cur===1) syncAuto();      // 1단계면 자동 성장 상태를 버튼에 반영
  if(cur===3 || cur===4) loadMind();   // 호기심·추론 단계면 아이 머릿속 보여주기
  if(cur===6) loadWeb();               // 진짜 이해 단계면 관계망 보여주기
  if(cur===7) loadSelf();
  if(cur===8) loadSocial();
}
async function loadSelf(){
  try{
    const r=await post("/self",{});
    const a=r.assess||{};
    const e1=document.getElementById("m_assess");
    if(e1) e1.innerHTML=`<div class="actline">확실히 아는 것 <b>${a["확실"]||0}</b> · 배우는 중 <b>${a["배우는중"]||0}</b> · 궁금한 것 <b>${a["궁금"]||0}</b> · 의심 <b>${a["의심"]||0}</b> · 관계 <b>${a["관계"]||0}</b> · 비유 <b>${a["비유"]||0}</b></div>`
      + ((a["추상으로_아는것"]||[]).length? `<div class="actline">추상으로 아는 것: ${(a["추상으로_아는것"]||[]).join(", ")}</div>`:"");
    const e2=document.getElementById("m_plan");
    if(e2){const p=r.plan||[]; e2.innerHTML=p.length? p.map((x,i)=>`<div class="actline">${i+1}) ${x["할일"]} — ${x["이유"]}</div>`).join("") : "<div class='hint'>아직 계획이 없어요 — 궁금한 게 생기면 스스로 세워요.</div>";}
    const e3=document.getElementById("m_first");
    if(e3){const f=r.first_words||[]; e3.innerHTML=f.length? f.map(x=>`<div class="actline">• '${x["단어"]}' → “${x["말"]}”</div>`).join("") : "<div class='hint'>아직 없어요 — 살면서 처음 확실히 알게 되면 여기 떠요.</div>";}
  }catch(e){}
}
async function loadSocial(){
  try{
    const r=await post("/social",{});
    const f=(id,arr,fn,empty)=>{const e=document.getElementById(id); if(e) e.innerHTML=(arr&&arr.length)? arr.map(fn).join("") : `<div class="hint">${empty}</div>`;};
    f("m_pref", r.prefs, x=>`<div class="actline">• ${x["것"]} — ${x["느낌"]}</div>`, "아직 없어요 — 겪을 때 기분이 쌓이면 생겨요.");
    f("m_meta", r.metaphors, x=>`<div class="actline">• ${x["말"]} ~ ${x["처럼"]}처럼 (${(x["같이쓰는말"]||[]).slice(0,3).join(", ")})</div>`, "아직 없어요 — \"시간은 돈이다\" 같은 말을 들으면 생겨요.");
    f("m_invented", r.invented_metaphors, x=>`<div class="actline">• ${x["말"]||x.a||""} ~ ${x["처럼"]||x.b||""}처럼 (${((x["같이쓰는말"]||x.shared||[])).slice(0,3).join(", ")})</div>`, "아직 없어요 — 아는 개념이 늘고, 하는 일이 겹치는 짝이 생기면 스스로 만들어요.");
    f("m_partner", r.partner, x=>`<div class="actline">• ${x["말"]} (${x["번"]}번)</div>`, "아직 없어요 — 말을 걸면 기억해요.");
    f("m_partnermind", r.partner_mind, x=>`<div class="actline">• ${typeof x==="string"?x:(x["말"]||"")+" — "+(x["추측"]||x["생각"]||"")}</div>`, "아직 없어요 — 같은 걸 자꾸 물으면 상대 마음을 추측해요.");
    f("m_empathy", r.empathy, x=>`<div class="actline">• ${x["것"]}: ${x["말"]}${x["내기분"]?` (내 기분: ${x["내기분"]})`:""}</div>`, "아직 없어요 — 내가 겪은 기분이 쌓이면 공감해요.");
    f("m_doubt", r.doubts, x=>`<div class="actline">• ${x["말"]}: ${(x["사이"]||[]).join(" ↔ ")}</div>`, "지금 의심은 없어요.");
  }catch(e){}
}
async function loadWeb(){
  try{
    const r = await post("/web",{});
    const e = document.getElementById("m_web");
    if(!e) return;
    const items = r.web||[];
    if(!items.length){ e.innerHTML = "<div class='hint'>아직 관계망이 없어요. 자동 성장 + ⚙검색을 켜고 살게 두면, 찾아 배우며 스스로 관계를 쌓아요.</div>"; return; }
    e.innerHTML = items.map(x=>{
      const c = (typeof x.confidence==="number") ? x.confidence : null;
      const bar = c===null ? "" : ` <span style="color:${c>=0.6?'#6fcf97':c>=0.3?'#e0b34a':'#9aa0b0'}">[확신 ${c}]</span>`;
      return `<div class="actline">• <b>${x.from}</b> —[${x.kind}]→ <b>${x.to}</b>${bar}</div>`;
    }).join("");
    const ab=document.getElementById("m_abstract");
    if(ab){ const arr=r.abstract||[]; ab.innerHTML = arr.length? arr.map(x=>`<div class="actline">• <b>${x.word}</b> (${x.kind}) — 추상</div>`).join("") : "<div class='hint'>아직 추상 개념을 구분 못 했어요.</div>"; }
    const an=document.getElementById("m_analogy");
    if(an){ const arr=r.analogy||[]; an.innerHTML = arr.length? arr.map(x=>`<div class="actline">• <b>${x.a}</b> ~ <b>${x.b}</b> (${x.why})</div>`).join("") : "<div class='hint'>아직 닮은 개념을 못 찾았어요.</div>"; }
  }catch(e){}
}
async function loadMind(){
  try{
    const m = await post("/mind",{});
    const fill=(id,arr,empty)=>{const e=document.getElementById(id); if(e) e.innerHTML = (arr&&arr.length)? arr.map(x=>`<div class="actline">• ${x}</div>`).join("") : `<div class="hint">${empty}</div>`;};
    fill("m_curious", m.curious, "아직 궁금한 게 없어요. 자동 성장을 켜고 살게 두면 생겨요.");
    fill("m_learned", m.learned, "아직 찾아 배운 게 없어요. 자동 성장 + ⚙검색을 켜보세요.");
    fill("m_inferred", m.inferred, "아직 추론한 게 없어요. 더 배우면 스스로 추론해요.");
    fill("m_causes", m.causes, "아직 아는 인과가 없어요.");
    fill("m_doubts", m.doubts, "지금 의심(모순)은 없어요.");
  }catch(e){}
}
async function syncAuto(){
  try{
    const s = await (await fetch("/stats")).json();
    const running = s.auto && s.auto.running;
    _auto = !!running;
    const b=document.getElementById("btn_auto");
    if(b){ b.textContent=_auto?"⏸ 자동 멈추기":"▶ 자동 성장 시작 (알아서 살고 배움)"; b.classList.toggle("go",_auto); }
  }catch(e){}
}
async function syncToggles(){
  try{
    const r = await post("/settings",{});
    const st = r.settings||{};
    document.querySelectorAll(".toggle").forEach(el=>{
      const m = el.getAttribute("data-key");
      if(m && st[m]!==undefined) el.classList.toggle("on", !!st[m]);
    });
  }catch(e){}
}
function show(id, html){ const e=document.getElementById(id); if(e) e.innerHTML = html; }
let _living=false;
let _auto=false;
async function toggleAutoMain(){
  _auto=!_auto;
  await post("/auto",{on:_auto, rate:600, curious_auto:true});
  const b=document.getElementById("btn_auto_main");
  if(b){ b.textContent=_auto?"⏸ 자동 멈추기":"▶ 자동 성장 시작"; b.classList.toggle("go",_auto);}
  refreshStatus();
}

// ── 채팅: 아는 건 답, 모르면 검색해서 알려줌 + 음성 ──
function _appendChat(who, text, cls){
  const log=document.getElementById("chat_log"); if(!log) return;
  if(log.querySelector(".hint")) log.innerHTML="";
  const d=document.createElement("div");
  d.style.margin="6px 0";
  d.innerHTML = (who==="나")
    ? `<b style="color:#7aa2f7">나:</b> ${text}`
    : `<b style="color:#9ece6a">아이:</b> ${text}` + (cls?` <span class="hint">(${cls})</span>`:"");
  log.appendChild(d); log.scrollTop=log.scrollHeight;
}
// 답을 통째로 읽지 않고, 문장 조각으로 나눠 '하나 끝나면 다음'으로 순차 발화(스트리밍).
// 조각이 들어오는 대로 대기열에 넣고 순서대로 말한다. 새 답이 오면 이전 발화는 멈춤.
let _speakQ=[], _speaking=false;
function _speakEnabled(){
  const el=document.getElementById("speak_on");
  return el && el.checked && ("speechSynthesis" in window);
}
function _splitChunks(text){
  // 문장 끝(. ! ? 。 …)이나 줄바꿈에서 자른다. 너무 길면 쉼표에서 한 번 더.
  let parts=[];
  (text||"").split(/(?<=[.!?。…\n])\s*/).forEach(s=>{
    s=s.trim(); if(!s) return;
    if(s.length>80){ s.split(/,\s*/).forEach(p=>{p=p.trim(); if(p) parts.push(p);}); }
    else parts.push(s);
  });
  return parts;
}
function _drainSpeak(){
  if(_speaking) return;
  if(!_speakEnabled()){ _speakQ=[]; return; }
  const next=_speakQ.shift();
  if(next===undefined) return;
  _speaking=true;
  const u=new SpeechSynthesisUtterance(next);
  u.lang="ko-KR"; u.rate=1.0;
  u.onend=()=>{ _speaking=false; _drainSpeak(); };
  u.onerror=()=>{ _speaking=false; _drainSpeak(); };
  window.speechSynthesis.speak(u);
}
// 답 전체를 한 번에 받는 경우: 조각내 대기열에 넣고 순차 발화(기존 호출 호환).
function _speak(text){
  try{
    if(!_speakEnabled()) return;
    window.speechSynthesis.cancel();
    _speakQ=[]; _speaking=false;
    _splitChunks(text).forEach(c=>_speakQ.push(c));
    _drainSpeak();
  }catch(e){}
}
// 조각이 만들어지는 대로 하나씩 흘려보내는 경우(진짜 스트리밍 발화).
function _speakStreamStart(){
  try{
    if(!_speakEnabled()) return;
    window.speechSynthesis.cancel();
    _speakQ=[]; _speaking=false;
  }catch(e){}
}
function _speakStreamPush(chunk){
  try{
    if(!_speakEnabled()) return;
    _splitChunks(chunk).forEach(c=>_speakQ.push(c));
    _drainSpeak();
  }catch(e){}
}
async function doChat(){
  const inp=document.getElementById("i_chat"); if(!inp) return;
  const t=inp.value.trim(); if(!t) return;
  inp.value="";
  _appendChat("나", t);
  _appendChat("아이", "…생각 중", "");
  try{
    const r=await post("/chat",{text:t});
    const log=document.getElementById("chat_log");
    if(log && log.lastChild) log.removeChild(log.lastChild); // "생각 중" 제거
    const reply=(r.reply&&r.reply.say)||"…";
    const src=(r.reply&&r.reply.source)||"";
    _appendChat("아이", reply, src);
    _speak(reply);
  }catch(e){
    _appendChat("아이", "(문제가 생겼어)", "");
  }
}

// ── 마이크: 브라우저 음성 인식(Web Speech API). 크롬에서 동작. ──
let _recog=null, _micOn=false;
function toggleMic(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const btn=document.getElementById("mic_btn");
  if(!SR){
    alert("이 브라우저는 음성 인식을 지원하지 않아요. 크롬(Chrome)에서 열어주세요.");
    return;
  }
  if(_micOn){ try{_recog && _recog.stop();}catch(e){} return; }
  _recog=new SR();
  _recog.lang="ko-KR"; _recog.interimResults=false; _recog.maxAlternatives=1;
  _recog.onstart=()=>{ _micOn=true; if(btn){btn.textContent="🔴"; btn.title="듣는 중… (누르면 멈춤)";} };
  _recog.onend=()=>{ _micOn=false; if(btn){btn.textContent="🎤"; btn.title="마이크로 말하기";} };
  _recog.onerror=(e)=>{ _micOn=false; if(btn){btn.textContent="🎤";}
    if(e.error==="not-allowed") alert("마이크 권한을 허용해주세요."); };
  _recog.onresult=(e)=>{
    const said=e.results[0][0].transcript;
    const inp=document.getElementById("i_chat");
    if(inp){ inp.value=said; doChat(); }
  };
  try{ _recog.start(); }catch(e){}
}

async function doLiveLoop(){
  if(_living) return;
  const ticks=Math.max(1, parseInt(document.getElementById("i_ticks").value)||10000);
  const loops=Math.max(1, parseInt(document.getElementById("i_loops").value)||1);
  _living=true;
  const btn=document.getElementById("btn_live"); if(btn){btn.disabled=true; btn.textContent="사는 중…";}
  try{
    for(let i=1;i<=loops;i++){
      show("o_live",`사는 중… (${i}/${loops}번째, 한 번에 ${ticks}틱)`);
      await post("/live",{steps:ticks});
      await refreshStatus();
    }
    show("o_live",`다 살았어요. 총 ${ticks*loops}틱 (${ticks}틱 × ${loops}번). 부족하면 또 누르세요.`);
  }catch(e){ show("o_live","오류 — 서버가 켜져 있나요?"); }
  finally{ _living=false; if(btn){btn.disabled=false; btn.textContent="살게 하기 시작";} }
}

async function doConcept(){
  const w=document.getElementById("i_con").value.trim();
  const r=await post("/concept",{word:w});

  const c=r.concept, u=r.understand;
  let t=`개념: ${c.개념}\n`;
  if(c.이름&&Object.keys(c.이름).length) t+=`이름: ${Object.values(c.이름).join(", ")}\n`;
  if(c.하는일&&c.하는일.length) t+=`하는 일: ${c.하는일.slice(0,5).join(", ")}\n`;
  if(c.종류) t+=`종류: ${c.종류}\n`;
  if(u) t+=`이해 깊이: ${u.수준} (${u.이해깊이}/7)`;
  show("o_con", t);
}

async function toggleSet(key, el){

  el.classList.toggle("on", on);
}

      <div class="hint" style="margin-top:12px">검색·로그인 계정·경로는 config.py 에서. 자세한 건 검증_가이드.txt.</div>
    </div>`,
};
drawSteps(); drawContent(); refreshStatus();
let _side=true;
function toggleSide(){
  _side=!_side;
  document.getElementById('side_panel').style.display=_side?'flex':'none';
  document.getElementById('side_open_btn').style.display=_side?'none':'block';
}
async function refreshBrowsing(){
  try{
    const b=await(await fetch('/browsing')).json();
    const d=document.getElementById('b_doing'); if(!d) return;
    d.textContent=b.doing||'대기 중';
    document.getElementById('b_url').textContent=(b.title? b.title+' · ':'')+(b.url||'');
    const img=document.getElementById('b_shot'), ns=document.getElementById('b_noshot');
    if(b.shot){ img.src='/browser_view.png?t='+Date.now(); img.style.display='block'; ns.style.display='none'; }
    else{
      img.style.display='none'; ns.style.display='block';
      ns.textContent = (b.playwright===false)
        ? '브라우저 화면 없음 — playwright 미설치. 명령창에: pip install playwright 그리고 python -m playwright install chromium'
        : '아직 브라우저 화면이 없어요 — 아이가 검색을 시작하면 여기 실제 화면이 떠요.';
    }
  }catch(e){}
}
setInterval(refreshBrowsing, 2500);
refreshBrowsing();

setInterval(refreshStatus, 8000);
setInterval(()=>{ if(cur===9) refreshStatus(); }, 2000);
</script>

<!-- ── 오른쪽 패널: 아이의 브라우저 실황 + 로그 (열고 닫기) ── -->
<button id="side_open_btn" onclick="toggleSide()" style="display:none;position:fixed;right:14px;top:14px;z-index:60;background:#2f6feb;color:#fff;border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-size:13px">🌐 브라우저 열기</button>
<div id="side_panel" style="position:fixed;right:0;top:0;bottom:0;width:460px;background:#0d1220;border-left:1px solid #263041;z-index:55;display:flex;flex-direction:column;padding:14px;gap:10px;overflow-y:auto">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <b style="font-size:14px">🌐 아이의 브라우저 — 검색·학습 실황</b>
    <button onclick="toggleSide()" style="background:#1a2233;color:#aab;border:1px solid #263041;border-radius:6px;padding:6px 10px;cursor:pointer">✕ 닫기</button>
  </div>
  <div class="hint">아이가 사람처럼 검색창에 치고, 사이트를 열어 읽는 모습이에요.</div>
  <div class="card" style="margin:0">
    <div class="label">지금 브라우저</div>
    <div id="b_doing" class="out" style="min-height:22px">대기 중</div>
    <div id="b_url" class="hint" style="word-break:break-all"></div>
    <img id="b_shot" style="width:100%;border:1px solid #263041;border-radius:8px;display:none;margin-top:8px" alt="아이가 보는 화면">
    <div id="b_noshot" class="hint" style="margin-top:8px">아직 브라우저 화면이 없어요 — 아이가 검색을 시작하면 여기 실제 화면이 떠요.</div>
  </div>
  <div class="card" style="margin:0;flex:1">
    <div class="label">실황 로그 (뭘 조사하고 배우는지)</div>
    <div id="side_log" class="autolog" style="min-height:160px"><div class="hint">자동 성장을 켜면 여기 실시간으로 떠요.</div></div>
  </div>
</div>
